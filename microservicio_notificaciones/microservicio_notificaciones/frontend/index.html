<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notificaciones</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f6fb; margin: 0; padding: 20px; }
    .panel { width: 360px; background: white; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); overflow: hidden; }
    .panel header { padding: 14px 18px; background: #2f7be5; color: white; font-weight: 600; display:flex; justify-content:space-between; align-items:center; }
    .panel .content { max-height: 420px; overflow:auto; padding: 10px 0; }
    .group { padding: 8px 18px; border-bottom: 1px solid #eef1fb; }
    .group-title { font-size: 13px; color:#6b7280; margin: 6px 0; }
    .item { display:flex; gap:12px; padding: 10px 0; align-items:flex-start; cursor: pointer; }
    .icon { width:36px; height:36px; border-radius:6px; background:#eef2ff; display:flex; align-items:center; justify-content:center; font-weight:700; color:#2f6be6; }
    .body { flex:1; }
    .title { font-weight:700; font-size:14px; margin:0; }
    .message { margin:4px 0 0 0; color:#374151; font-size:13px; }
    .meta { font-size:12px; color:#9ca3af; margin-top:6px; display:flex; justify-content:space-between; align-items:center; }
    .unread-dot { width:10px; height:10px; border-radius:50%; background:#ef4444; display:inline-block; margin-right:8px; }
    .footer { padding: 12px 18px; text-align:center; border-top:1px solid #f1f5f9; background:#fff; }
    .see-all { color:#2f7be5; text-decoration:none; font-weight:600; }
    .item.leido .title, .item.leido .message { color:#9ca3af; }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <header>
      <span>Notificaciones</span>
      <button id="markAll" title="Marcar todo como leído" style="background:none;border:none;color:white;cursor:pointer">✔</button>
    </header>
    <div class="content" id="content">
      <!-- grupos aparecerán aquí -->
    </div>
    <div class="footer">
      <a href="#" class="see-all" id="verTodo">Verlo todo</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
