services:
  db:
    image: postgres:15
    container_name: liga_cut_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./src/Dockerfile
    container_name: liga_cut_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # versión síncrona para Alembic
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/auth_db
      # versión asíncrona para SQLAlchemy async
      DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@db:5432/auth_db
      SECRET_KEY: LIGA_CUT
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 35
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: poetry run uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./web
      dockerfile: ./Dockerfile
    container_name: liga_cut_frontend
    depends_on:
      - backend
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  pgdata:
