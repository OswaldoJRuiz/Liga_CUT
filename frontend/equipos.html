<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle Equipo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="equipo_detalle.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden { display: none !important; }
  </style>
</head>
<body class="bg-[#0f172a] text-white">
  <!-- Navbar -->
  <nav class="flex items-center justify-between bg-[#1e293b] shadow-lg px-6 py-4 rounded-b-2xl relative">
    <div class="relative">
      <!-- Botón hamburguesa -->
      <button id="menuBtn" type="button" class="focus:outline-none relative z-60 cursor-pointer" aria-expanded="false" aria-controls="menu">
        <svg class="w-12 h-12 text-[#e2e8f0]" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <span class="sr-only">Abrir menú</span>
      </button>

      <!-- Menú desplegable -->
      <div id="menu" class="hidden absolute mt-3 w-48 bg-[#1e293b] rounded-2xl shadow-lg z-50" role="menu" aria-hidden="true">
        <a href="index.html" class="block px-4 py-2 text-[#e2e8f0] hover:bg-[#22c55e]/20" role="menuitem">Registro</a>
        <a href="inicio.html" class="block px-4 py-2 text-[#e2e8f0] hover:bg-[#22c55e]/20" role="menuitem">Inicio</a>
        <a href="conocenos.html" class="block px-4 py-2 text-[#22c55e] font-semibold" role="menuitem">Conócenos</a>
        <a href="calendario.html" class="block px-4 py-2 text-[#e2e8f0] hover:bg-[#22c55e]/20" role="menuitem">Calendario</a>
      </div>
    </div>

    <!-- Logo -->
    <div>
      <img src="/frontend/assets/cut.png" alt="Logo UDG" class="h-14">
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="max-w-3xl mx-auto p-8">
    <div id="equipoDetalle"></div>
  </div>

  <!-- SCRIPT: menú hamburguesa -->
  <script>
  (function () {
    const menuBtn = document.getElementById('menuBtn');
    const menu = document.getElementById('menu');

    if (!menuBtn || !menu) return;

    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const willBeOpen = menu.classList.contains('hidden');
      if (willBeOpen) {
        menu.classList.remove('hidden');
        menuBtn.setAttribute('aria-expanded', 'true');
        menu.setAttribute('aria-hidden', 'false');
      } else {
        menu.classList.add('hidden');
        menuBtn.setAttribute('aria-expanded', 'false');
        menu.setAttribute('aria-hidden', 'true');
      }
    });

    document.addEventListener('click', (e) => {
      if (!menu.classList.contains('hidden') && !menu.contains(e.target) && !menuBtn.contains(e.target)) {
        menu.classList.add('hidden');
        menuBtn.setAttribute('aria-expanded', 'false');
        menu.setAttribute('aria-hidden', 'true');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        menuBtn.setAttribute('aria-expanded', 'false');
        menu.setAttribute('aria-hidden', 'true');
      }
    });
  })();
  </script>
</body>
</html>
